name: Update MT offline data

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Manual run note"
        required: false
        default: "manual"
      soft_minutes:
        description: "Soft time budget (minutes) before commit & exit"
        required: false
        default: "300"
  schedule:
    # 每 6 小時續跑；公開 repo Actions 單次最長約 6h，靠排程疊加跑完 ~3000 檔
    - cron: "15 */6 * * *"

concurrency:
  group: mt-offline-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write FinMind tokens
        env:
          FINMIND_TOKENS_JSON: ${{ secrets.FINMIND_TOKENS_JSON }}
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = "tools/finmind_tokens.local.json"
          raw_json = (os.environ.get("FINMIND_TOKENS_JSON") or "").strip()
          raw_csv = (os.environ.get("FINMIND_TOKENS") or "").strip()
          out = []
          if raw_json:
              data = json.loads(raw_json)
              if isinstance(data, list):
                  for i, item in enumerate(data):
                      if isinstance(item, str) and item.strip():
                          out.append({"name": f"token-{i+1}", "token": item.strip()})
                      elif isinstance(item, dict) and item.get("token"):
                          out.append({
                              "name": str(item.get("name") or f"token-{i+1}"),
                              "token": str(item["token"]).strip(),
                          })
          elif raw_csv:
              tokens = [t.strip() for t in raw_csv.split(",") if t.strip()]
              out = [{"name": f"token-{i+1}", "token": t} for i, t in enumerate(tokens)]
          if not out:
              print("Missing secret: set FINMIND_TOKENS_JSON or FINMIND_TOKENS", file=sys.stderr)
              sys.exit(1)
          open(path, "w", encoding="utf-8").write(json.dumps(out, ensure_ascii=False, indent=2) + "\n")
          print(f"Wrote {len(out)} tokens to {path} (not committed)")
          PY

      - name: Fetch (resume, soft budget)
        env:
          MT_OFFLINE_ROOT: ${{ github.workspace }}
          MT_REPO_ROOT: ${{ github.workspace }}
          # 避免在 CI 誤寫 App seed
          MT_APP_SEED_DIR: ""
        run: |
          SOFT="${{ github.event.inputs.soft_minutes || '300' }}"
          echo "Soft budget: ${SOFT} minutes (Actions hard cap ~360)"
          set +e
          timeout "${SOFT}m" python3 -u tools/fetch_historical_data.py
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "Soft timeout reached — committing partial progress"
            exit 0
          fi
          exit "$code"

      - name: Commit & push progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 絕不提交 token
          rm -f tools/finmind_tokens.local.json tools/finmind_tokens.local.txt
          git add -A status.json manifest.json metrics_index.json assets.json stock_directory.json metrics/ || true
          git add incomplete_report.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update offline data ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
            git push
          fi
          if [ -f status.json ]; then
            python3 - <<'PY'
          import json
          s=json.load(open("status.json"))
          print(f"status: {s.get('complete')}/{s.get('universe')} ({s.get('coveragePercent')}%) round={s.get('round')}")
          PY
          fi
