name: Update MT offline data

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Manual run note"
        required: false
        default: "manual"
      market:
        description: "選擇市場 (all / tw / us / package)"
        required: false
        default: "all"
  schedule:
    # 每日排程自動執行
    - cron: "15 */6 * * *"
    - cron: "30 0 * * 1-5"
    - cron: "30 5 * * 1-5"
    # 美股收盤排程 (美東 16:30 = UTC 20:30)
    - cron: "30 20 * * 1-5"

concurrency:
  group: mt-offline-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install yfinance pandas numpy requests urllib3

      - name: Fetch US Offline Data & Options Wall
        if: ${{ github.event.inputs.market != 'tw' }}
        env:
          MT_OFFLINE_ROOT: ${{ github.workspace }}
          MT_REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 -u tools/fetch_us_offline_data.py || echo "US fetch completed with warnings"

      - name: Write FinMind tokens
        if: ${{ github.event.inputs.market != 'us' && (env.FINMIND_TOKENS_JSON != '' || env.FINMIND_TOKENS != '') }}
        env:
          FINMIND_TOKENS_JSON: ${{ secrets.FINMIND_TOKENS_JSON }}
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = "tools/finmind_tokens.local.json"
          raw_json = (os.environ.get("FINMIND_TOKENS_JSON") or "").strip()
          raw_csv = (os.environ.get("FINMIND_TOKENS") or "").strip()
          out = []
          if raw_json:
              data = json.loads(raw_json)
              if isinstance(data, list):
                  for i, item in enumerate(data):
                      if isinstance(item, str) and item.strip():
                          out.append({"name": f"token-{i+1}", "token": item.strip()})
                      elif isinstance(item, dict) and item.get("token"):
                          out.append({
                              "name": str(item.get("name") or f"token-{i+1}"),
                              "token": str(item["token"]).strip(),
                          })
          elif raw_csv:
              tokens = [t.strip() for t in raw_csv.split(",") if t.strip()]
              out = [{"name": f"token-{i+1}", "token": t} for i, t in enumerate(tokens)]
          if not out:
              print("No tokens found; skipping TW fetch", file=sys.stderr)
              sys.exit(0)
          open(path, "w", encoding="utf-8").write(json.dumps(out, ensure_ascii=False, indent=2) + "\n")
          print(f"Wrote {len(out)} tokens to {path}")
          PY

      - name: Fetch TW Data (resume, soft budget)
        if: ${{ github.event.inputs.market != 'us' && hashFiles('tools/finmind_tokens.local.json') != '' }}
        env:
          MT_OFFLINE_ROOT: ${{ github.workspace }}
          MT_REPO_ROOT: ${{ github.workspace }}
          MT_APP_SEED_DIR: ""
        run: |
          set +e
          timeout 300m python3 -u tools/fetch_historical_data.py
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "Soft timeout reached — committing partial progress"
            exit 0
          fi

      - name: Package Full Bundle Zip
        env:
          MT_OFFLINE_ROOT: ${{ github.workspace }}
          MT_REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 -u tools/package_offline_bundle.py || echo "Packaging completed with warnings"

      - name: Commit & push progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/finmind_tokens.local.json tools/finmind_tokens.local.txt
          git add -A status.json manifest.json metrics_index.json assets.json stock_directory.json us_index_history.json us_options_wall.json us_stock_directory.json mt_offline_bundle.zip metrics/ tools/ docs/ || true
          git add incomplete_report.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: automated update TW & US offline data ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
